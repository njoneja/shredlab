[package]
name = "shredlab-beats"
description = "Beat This! beat/downbeat tracking glue (preprocessing, chunking, postprocessing) for Stem Extractor"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
realfft.workspace = true
rubato.workspace = true
thiserror.workspace = true

[dev-dependencies]
# Only for the end-to-end example / tests; the library API is ORT-free.
# Same pin as crates/shredlab-separation.
ort = { version = "=2.0.0-rc.15", default-features = false, features = ["std", "download-binaries", "copy-dylibs", "tls-native"] }
symphonia.workspace = true
