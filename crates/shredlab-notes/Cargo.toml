[package]
name = "shredlab-notes"
description = "Note detection for ShredLab: single notes, bends, slides and legato from one pitched stem"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
realfft.workspace = true
shredlab-beats.workspace = true
shredlab-tuning.workspace = true

[dev-dependencies]
shredlab-library.workspace = true
shredlab-dsp.workspace = true
# The example prints the size of the other notes heard as stored.
serde_json.workspace = true
# Only for the notes_library example's --model; the library API is ORT-free.
# Same pin as crates/shredlab-separation.
ort = { version = "=2.0.0-rc.15", default-features = false, features = ["std", "download-binaries", "copy-dylibs", "tls-native"] }
