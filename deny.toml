# cargo-deny: run `cargo deny check` (CI runs it on every push and weekly).

[graph]
# Only the platforms we ship. Linux-only crates (gtk-rs, webkit2gtk) are in
# Cargo.lock through Tauri but never compiled into our builds.
targets = [
    "x86_64-pc-windows-msvc",
    "aarch64-pc-windows-msvc",
    "x86_64-apple-darwin",
    "aarch64-apple-darwin",
]
all-features = true

[advisories]
# Unmaintained warnings only for crates we depend on directly; transitive ones
# are for upstream (Tauri etc.) to replace.
unmaintained = "workspace"
ignore = []

[licenses]
# Everything must be compatible with GPL-3.0-or-later (our own crates).
allow = [
    "GPL-3.0-or-later",
    "MIT",
    "MIT-0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "CC0-1.0",
    "MPL-2.0",
    "Unlicense",
]
confidence-threshold = 0.9
exceptions = [
    # LAME, statically linked; see crates/stemx-audio/THIRD_PARTY.md.
    { crate = "mp3lame-encoder", allow = ["LGPL-3.0"] },
    { crate = "mp3lame-sys", allow = ["LGPL-3.0"] },
    # Mozilla's CA certificate data.
    { crate = "webpki-root-certs", allow = ["CDLA-Permissive-2.0"] },
]

[bans]
multiple-versions = "allow"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
