[package]
name = "shredlab"
description = "ShredLab desktop app (Tauri shell)"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true
publish = false

[lib]
# The `_lib` suffix avoids a lib/bin name clash on Windows
# (https://github.com/rust-lang/cargo/issues/8519).
name = "shredlab_lib"
# rlib only: staticlib/cdylib are for Tauri's mobile targets, and on Windows
# the bundler would ship the cdylib (a 22 MB DLL) in the installers.
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde.workspace = true
serde_json.workspace = true
shredlab-io.workspace = true
shredlab-separation.workspace = true
shredlab-beats.workspace = true
shredlab-library.workspace = true
shredlab-audio.workspace = true
shredlab-dsp.workspace = true
