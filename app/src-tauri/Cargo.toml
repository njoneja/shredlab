[package]
name = "stem-extractor"
description = "Stem Extractor desktop app (Tauri shell)"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true
publish = false

[lib]
# The `_lib` suffix avoids a lib/bin name clash on Windows
# (https://github.com/rust-lang/cargo/issues/8519).
name = "stem_extractor_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
stemx-dsp.workspace = true
stemx-io.workspace = true
stemx-separation.workspace = true
stemx-audio.workspace = true
stemx-library.workspace = true
