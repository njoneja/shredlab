[workspace]
resolver = "2"
members = [
    "crates/shredlab-dsp",
    "crates/shredlab-io",
    "crates/shredlab-separation",
    "crates/shredlab-beats",
    "crates/shredlab-audio",
    "crates/shredlab-library",
    "crates/shredlab-cli",
    "app/src-tauri",
]

[workspace.package]
version = "0.1.1"
edition = "2021"
license = "GPL-3.0-or-later"
authors = ["Navneet Joneja"]
rust-version = "1.92"

[workspace.dependencies]
shredlab-dsp = { path = "crates/shredlab-dsp" }
shredlab-io = { path = "crates/shredlab-io" }
shredlab-separation = { path = "crates/shredlab-separation" }
shredlab-beats = { path = "crates/shredlab-beats" }
shredlab-audio = { path = "crates/shredlab-audio" }
shredlab-library = { path = "crates/shredlab-library" }

anyhow = "1"
clap = { version = "4", features = ["derive"] }
flacenc = { version = "0.5", default-features = false, features = ["par"] }
hound = "3.5"
mp3lame-encoder = "0.2"
num_cpus = "1.16"
realfft = "3.4"
rubato = "0.16"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
symphonia = { version = "0.5", default-features = false, features = ["mp3", "flac", "wav", "pcm", "vorbis", "ogg", "aac", "isomp4", "alac", "adpcm"] }
thiserror = "2"

# Release profile tuned for small binaries (see https://tauri.app/concept/size/).
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

# Dev builds: optimize dependencies and the DSP-heavy workspace crates so
# `pnpm --dir app tauri dev` decodes, resamples and separates at usable
# speed (and the audio callback doesn't underrun). App glue stays debug.
[profile.dev.package."*"]
opt-level = 3

[profile.dev.package.shredlab-dsp]
opt-level = 3

[profile.dev.package.shredlab-io]
opt-level = 3

[profile.dev.package.shredlab-beats]
opt-level = 3

[profile.dev.package.shredlab-separation]
opt-level = 3

[profile.dev.package.shredlab-library]
opt-level = 3

[profile.dev.package.shredlab-audio]
opt-level = 3
