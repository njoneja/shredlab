[workspace]
resolver = "2"
members = [
    "crates/stemx-dsp",
    "crates/stemx-io",
    "crates/stemx-separation",
    "crates/stemx-beats",
    "crates/stemx-audio",
    "crates/stemx-library",
    "crates/stemx-cli",
    "app/src-tauri",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["Stem Extractor contributors"]
rust-version = "1.92"

[workspace.dependencies]
stemx-dsp = { path = "crates/stemx-dsp" }
stemx-io = { path = "crates/stemx-io" }
stemx-separation = { path = "crates/stemx-separation" }
stemx-beats = { path = "crates/stemx-beats" }
stemx-audio = { path = "crates/stemx-audio" }
stemx-library = { path = "crates/stemx-library" }

anyhow = "1"
clap = { version = "4", features = ["derive"] }
hound = "3.5"
num_cpus = "1.16"
realfft = "3.4"
rubato = "0.16"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
symphonia = { version = "0.5", default-features = false, features = ["mp3", "flac", "wav", "pcm", "vorbis", "ogg", "aac", "isomp4", "alac", "adpcm"] }
thiserror = "2"

# Release profile tuned for small binaries (see https://tauri.app/concept/size/).
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

# Dev builds: optimize dependencies and the DSP-heavy workspace crates so
# `pnpm --dir app tauri dev` decodes, resamples and separates at usable
# speed (and the audio callback doesn't underrun). App glue stays debug.
[profile.dev.package."*"]
opt-level = 3

[profile.dev.package.stemx-dsp]
opt-level = 3

[profile.dev.package.stemx-io]
opt-level = 3

[profile.dev.package.stemx-beats]
opt-level = 3

[profile.dev.package.stemx-separation]
opt-level = 3

[profile.dev.package.stemx-library]
opt-level = 3

[profile.dev.package.stemx-audio]
opt-level = 3
