name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  spdx:
    name: SPDX headers
    if: github.repository == 'njoneja/shredlab'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sh tools/check_spdx.sh

  build:
    name: ${{ matrix.os }}
    # Only on the public repo: Actions minutes are free there, not on the
    # private dev repo it is published from.
    if: github.repository == 'njoneja/shredlab'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            tauri_args: --debug --no-bundle
            artifact_path: target/debug/shredlab.exe
          - os: macos-latest
            tauri_args: --debug --bundles app
            artifact_path: target/debug/bundle/macos/shredlab-app.tar.gz
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - uses: pnpm/action-setup@v4
        with:
          version: 12

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml

      # The ONNX models are not in git; the Tauri crate bundles them, so
      # every build needs them. Built from the upstream checkpoints and cached.
      - name: Cache models
        id: models-cache
        uses: actions/cache@v4
        with:
          path: models
          key: models-${{ runner.os }}-${{ hashFiles('requirements-models.txt', 'tools/setup_models.py', 'tools/registry.py', 'tools/reference/**', 'spikes/onnx_demucs.py', 'spikes/onnx_demucs_own.py', 'spikes/onnx_beat_this.py') }}

      - uses: actions/setup-python@v5
        if: steps.models-cache.outputs.cache-hit != 'true'
        with:
          python-version: '3.12'

      - name: Build models
        if: steps.models-cache.outputs.cache-hit != 'true'
        run: python tools/setup_models.py

      - name: Install frontend dependencies
        working-directory: app
        run: pnpm install --frozen-lockfile

      - name: Type-check frontend
        working-directory: app
        run: pnpm check

      # The committed notices must match Cargo.lock and node_modules.
      - name: Third-party licences up to date
        if: runner.os == 'Windows'
        run: node tools/third_party_licenses/generate.mjs --check

      # tauri::generate_context! needs app/dist to exist, so build the
      # frontend before clippy/test compile the Tauri crate.
      - name: Build frontend
        working-directory: app
        run: pnpm build

      - name: cargo fmt
        run: cargo fmt --all --check

      - name: cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: cargo test
        run: cargo test --workspace

      - name: Build Tauri app
        working-directory: app
        run: pnpm tauri build ${{ matrix.tauri_args }}

      - name: Package macOS app bundle
        if: runner.os == 'macOS'
        working-directory: target/debug/bundle/macos
        # tar keeps the executable bit, which upload-artifact's zip drops.
        run: tar -czf shredlab-app.tar.gz "ShredLab.app"

      - uses: actions/upload-artifact@v4
        with:
          name: shredlab-${{ runner.os }}-debug
          path: ${{ matrix.artifact_path }}
          if-no-files-found: error
